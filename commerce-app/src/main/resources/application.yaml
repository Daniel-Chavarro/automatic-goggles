server:
  port: 8080

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: taller_1_java
  datasource:
    url: jdbc:postgresql://localhost:5432/${COMMERCE_DATASOURCE_DB:taller-java-db}
    username: ${SPRING_DATASOURCE_USERNAME:original-username}
    password: ${SPRING_DATASOURCE_PASSWORD:original-password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false


springdoc:
  paths-to-match: /api/**

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:36000000}
  refresh:
    expiration: ${JWT_REFRESH_EXPIRATION:604800000}

app:
  bootstrap:
    first-name: ${APP_BOOTSTRAP_FIRST_NAME:AdminTest}
    last-name: ${APP_BOOTSTRAP_LAST_NAME:UserAutoGenerated}
    email: ${APP_BOOTSTRAP_EMAIL:admin@test.com}
    password: ${APP_BOOTSTRAP_PASSWORD:Admin123!}
    phone: ${APP_BOOTSTRAP_PHONE:1234567890}



