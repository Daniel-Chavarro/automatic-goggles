server:
  port: 8080

spring:
  application:
    name: taller_1_java
  datasource:
    url: jdbc:postgresql://localhost:5432/${SPRING_DATASOURCE_URL:taller-java-db}
    username: ${SPRING_DATASOURCE_USERNAME:original-username}
    password: ${SPRING_DATASOURCE_PASSWORD:original-password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  paths-to-match: /api/**